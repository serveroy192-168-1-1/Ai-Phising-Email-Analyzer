version: '3.8'

services:
  phishing-analyzer:
    build: .
    container_name: ai-phishing-analyzer
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=cybersecurity-ai-phishing-production-key-2026
    volumes:
      - ./data:/app/data
    restart: unless-stopped
